# XcodeGen spec. The .xcodeproj is generated and gitignored.
#
#   make ios-generate   # xcodegen generate
#   make ios-build      # Debug build for a simulator
#   make ios-test       # the ChessDashboardKit tests, on a simulator
#   make kit-test       # the same tests on the Mac, in seconds (swift test)
name: ChessDashboard

options:
  bundleIdPrefix: dev.danielgentile
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 58N856BAX8
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # CD_BASE_URL (the server, read from Info.plist as CDBaseURL) is set per
    # configuration in Config/Base.xcconfig, so Local.xcconfig can override it.

packages:
  ChessDashboardKit:
    path: ChessDashboardKit

targets:
  ChessDashboard:
    type: application
    platform: iOS
    sources:
      - path: ChessDashboard
    dependencies:
      - package: ChessDashboardKit
        product: ChessDashboardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.danielgentile.chessdashboard
        PRODUCT_NAME: ChessDashboard
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ChessDashboard/Info.plist
      properties:
        CFBundleDisplayName: Chess Dashboard
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CDBaseURL: $(CD_BASE_URL)
        NSAppTransportSecurity:
          # Debug's http://localhost server. Release talks HTTPS only.
          NSAllowsLocalNetworking: true

schemes:
  ChessDashboard:
    build:
      targets:
        ChessDashboard: all
    run:
      config: Debug
    test:
      config: Debug
      # The package's own test target, so `xcodebuild test -scheme
      # ChessDashboard` runs the same suite `swift test` does.
      targets:
        - package: ChessDashboardKit/ChessDashboardKitTests
    archive:
      config: Release
